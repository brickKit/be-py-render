[project]
name = "be-py-render"
version = "3.0.43"
description = "The Python render shell (be/py-render): one process hosting the Python members installed below"
requires-python = ">=3.15,<3.16"
dependencies = ["be-sdk", "be-test-probe-py", "infra-print"]

[dependency-groups]
dev = ["pytest", "pyyaml"]

[tool.uv]
# one SDK in the process for every member, whatever tag a member pins for its own builds; never older than the minimum
# a member declares (be-sdk>=... in its metadata), which the launcher checks at start (P1.21)
override-dependencies = ["be-sdk @ git+https://github.com/brickKit/be-sdk-python@v3.0.0a52"]

[tool.uv.sources]
# members by tag, never from a local path (the launcher refuses local installs in a release build)
# one SDK in the process: the one every Python member runs (v3.0.0a52: the probes 3.2.43 and infra/print 3.0.16)
be-sdk = { git = "https://github.com/brickKit/be-sdk-python", tag = "v3.0.0a52" }
be-test-probe-py = { git = "https://github.com/brickKit/be-acceptance", tag = "test-probe-py/3.2.43", subdirectory = "probes/py" }
infra-print = { git = "https://github.com/brickKit/infra-print", tag = "3.0.16" }
contract-infra-print = { git = "https://github.com/brickKit/infra-print", tag = "contract/v3.0.0-alpha.1", subdirectory = "contract/python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["be_py_render"]
