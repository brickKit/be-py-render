[project]
name = "be-py-render"
version = "3.0.8"
description = "The Python render shell (be/py-render): one process hosting the Python members installed below"
requires-python = ">=3.15,<3.16"
dependencies = ["be-sdk", "be-test-probe-py"]

[dependency-groups]
dev = ["pytest", "pyyaml"]

[tool.uv.sources]
# members by tag, never from a local path (the launcher refuses local installs in a release build)
be-sdk = { git = "https://github.com/brickKit/be-sdk-python", tag = "v3.0.0a9" }
be-test-probe-py = { git = "https://github.com/brickKit/be-acceptance", tag = "test-probe-py/3.2.8", subdirectory = "probes/py" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["be_py_render"]
